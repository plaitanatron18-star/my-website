/* =====================================================================
   3) MATH GENERATOR
   ===================================================================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genMath(set, idx){
  const r = mulberry32(set*1000 + idx*7 + 13), ri=(a,b)=>a+Math.floor(r()*(b-a+1));
  const type = idx % 6; let q, ans, exp;
  if(type===0){ const p=ri(1,9)*5, b=ri(2,40)*20; ans=p*b/100; q=`${p}% ของ ${b.toLocaleString()} มีค่าเท่าใด`; exp=`${p}% ของ ${b} = ${b} × ${p} ÷ 100 = ${ans}\nทริค: หา 10% ก่อน (เลื่อนจุดทศนิยม) แล้วค่อยคูณหรือหาร`; }
  else if(type===1){ const P=ri(5,50)*100, d=ri(1,6)*5; ans=P*(100-d)/100; q=`สินค้าราคา ${P.toLocaleString()} บาท ลดราคา ${d}% ต้องจ่ายเงินกี่บาท`; exp=`ลด ${d}% เท่ากับจ่าย ${100-d}%\n= ${P} × ${100-d} ÷ 100 = ${ans.toLocaleString()} บาท`; }
  else if(type===2){ const n=[...Array(5)].map(()=>ri(10,99)); let s=n.reduce((a,b)=>a+b,0); const adj=s%5; n[4]-=adj; s-=adj; ans=s/5; q=`ค่าเฉลี่ยของ ${n.join(', ')} เท่ากับเท่าใด`; exp=`ผลรวม = ${n.join(' + ')} = ${s}\nค่าเฉลี่ย = ${s} ÷ 5 = ${ans}`; }
  else if(type===3){ const a=ri(2,20), d=ri(2,9); const seq=[0,1,2,3,4].map(i=>a+i*d); ans=a+5*d; q=`จงหาจำนวนถัดไปของอนุกรม: ${seq.join(', ')}, ...`; exp=`เป็นอนุกรมเลขคณิตที่เพิ่มขึ้นทีละ ${d}\n${seq[4]} + ${d} = ${ans}`; }
  else if(type===4){ const v=ri(4,12)*10, h=ri(2,6); ans=v*h; q=`รถยนต์วิ่งด้วยความเร็วเฉลี่ย ${v} กม./ชม. เป็นเวลา ${h} ชั่วโมง จะได้ระยะทางกี่กิโลเมตร`; exp=`ระยะทาง = ความเร็ว × เวลา = ${v} × ${h} = ${ans} กม.`; }
  else { const m=ri(1,5); let n; do{n=ri(1,6)}while(n===m); const k=ri(2,20)*10, T=(m+n)*k; ans=m*k; q=`แบ่งเงิน ${T.toLocaleString()} บาท ให้ ก และ ข ในอัตราส่วน ${m} : ${n} ก จะได้เงินกี่บาท`; exp=`รวม ${m+n} ส่วน → 1 ส่วน = ${T} ÷ ${m+n} = ${k}\nก ได้ ${m} ส่วน = ${(m*k).toLocaleString()} บาท`; }
  const s4=new Set([ans]); while(s4.size<4){ const v=ans+Math.max(1,Math.round(Math.abs(ans)*(0.05+r()*0.3)))*(r()<.5?-1:1); if(v>0) s4.add(v); }
  const nums=[...s4].sort((a,b)=>a-b);
  return { id:`S${set}-GEN-AUTO${String(idx+1).padStart(2,'0')}`, set, subject:'math', difficulty:2, fixed:false,
           question:q, choices:nums.map(x=>x.toLocaleString()), answer:nums.indexOf(ans), explanation:exp };
}

let _bank=null;
function getBank(){
  if(_bank) return _bank;
  let b=LS.get(K.bank,null);
  if(!Array.isArray(b)){                                  // ครั้งแรก: สร้างคลังจาก SEED + โจทย์คำนวณอัตโนมัติ + ข้อมูลจาก v1
    const map=new Map(), add=q=>map.set(q.id,{difficulty:2,fixed:false,...q});
    SEED.forEach(add);
    for(let s=1;s<=10;s++) for(let i=0;i<20;i++) add(genMath(s,i));

    b=[...map.values()]; LS.set(K.bank,b);
  }
  return _bank=b;
}
function saveBank(arr){ LS.set(K.bank,arr); _bank=arr; }
function recordAnswers(list){
  const st=LS.get(K.stats,{}), now=Date.now();
  list.forEach(([id,ok])=>{ const s=st[id]||{seen:0,correct:0,wrong:0,box:0,last:0};
    s.seen++; if(ok){ s.correct++; s.box=Math.min(5,s.box+1) } else { s.wrong++; s.box=0 } s.last=now; st[id]=s; });
  LS.set(K.stats,st);
}

/* =====================================================================
   5) CORE ALGORITHM — สุ่มข้อสอบ + Spaced Repetition + สลับช้อยส์
   ===================================================================== */
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function shuffleChoices(q){
  if(q.fixed) return {...q};
  const order=shuffle([0,1,2,3]);
  return { ...q, choices:order.map(i=>q.choices[i]), answer:order.indexOf(q.answer) };
}
const isDue=(s,now)=> s && (now-s.last) >= INTERVAL_DAYS[s.box]*864e5;
function pickForSubject(sk, quota, setNo, bank, stats, ratio){
  const pool=bank.filter(q=>q.subject===sk); if(!pool.length) return [];
  const now=Date.now(), picked=new Map();
  pool.filter(q=>isDue(stats[q.id],now))
    .sort((a,b)=>(stats[a.id].box-stats[b.id].box)||(stats[b.id].wrong-stats[a.id].wrong)||(stats[a.id].last-stats[b.id].last))
    .slice(0, Math.round(quota*ratio)).forEach(q=>picked.set(q.id,q));
  const unseen=pool.filter(q=>!stats[q.id]), inSet=q=>setNo && Number(q.set)===Number(setNo);
  for(const q of [...shuffle(unseen.filter(inSet)), ...shuffle(unseen.filter(q=>!inSet(q)))]){ if(picked.size>=quota) break; picked.set(q.id,q); }
  for(const q of pool.filter(q=>!picked.has(q.id)).sort((a,b)=>(stats[a.id]?.last||0)-(stats[b.id]?.last||0))){ if(picked.size>=quota) break; picked.set(q.id,q); }
  const arr=[...picked.values()], base=shuffle(pool); let i=0;
  while(arr.length<quota){ arr.push(base[i%base.length]); i++; }
  return shuffle(arr);
}
function buildMockExam(setNo){
  const bank=getBank(), stats=LS.get(K.stats,{}), r=getSettings().reviewMock; let qs=[];
  for(const [k,s] of Object.entries(SUBJECTS)) qs.push(...pickForSubject(k,s.quota,setNo,bank,stats,r));
  return qs.map(shuffleChoices);
}
function buildPractice(subject,count){
  const bank=getBank(), stats=LS.get(K.stats,{}), r=getSettings().reviewPractice; let qs=[];
  if(subject==='all'){ for(const [k,s] of Object.entries(SUBJECTS)) qs.push(...pickForSubject(k,Math.max(1,Math.round(count*s.quota/150)),null,bank,stats,r)); qs=shuffle(qs); }
  else qs=pickForSubject(subject,count,null,bank,stats,r);
  return qs.map(shuffleChoices);
}

/* =====================================================================
   8) SESSION CONTROL
   ===================================================================== */
function newSession(mode,qs,label,extra={}){
  if(!qs.length){ alert('ไม่มีข้อสอบในหมวดนี้'); return; }
  if(S && !confirm('มีข้อสอบที่ทำค้างไว้ ต้องการทิ้งและเริ่มใหม่หรือไม่?')) return;
  const secs=getSettings().mockMinutes*60;
  S={ mode, qs, label, answers:{}, idx:0, startedAt:Date.now(), endAt: mode==='mock'?Date.now()+secs*1000:null, ...extra };
  saveS(); go('exam');
}
function startMock(n){ newSession('mock', buildMockExam(n), `สอบจำลองชุดที่ ${n}`, {setNo:n}); }
function startPractice(){ const s=$('#pSub').value, c=+$('#pCnt').value; newSession('practice', buildPractice(s,c), `ฝึกซ้อม: ${s==='all'?'ทุกวิชา':SUBJECTS[s].short} ${c} ข้อ`); }
function startWrongReview(){
  const st=LS.get(K.stats,{}); const qs=getBank().filter(q=>st[q.id]&&st[q.id].wrong>0&&st[q.id].box<3).sort((a,b)=>st[a.id].box-st[b.id].box).slice(0,30);
  if(!qs.length) return alert('ยังไม่มีข้อที่ต้องทบทวน');
  newSession('practice', shuffle(qs).map(shuffleChoices), `ทบทวนข้อที่เคยผิด ${qs.length} ข้อ`);
}
function startBookmarkPractice(){
  const ids=LS.get(K.bm,[]); const qs=getBank().filter(q=>ids.includes(q.id));
  if(!qs.length) return alert('ยังไม่มีข้อที่บันทึกไว้');
  newSession('practice', shuffle(qs).map(shuffleChoices), `ฝึกข้อที่บันทึกไว้ ${qs.length} ข้อ`);
}
function abandon(){ if(confirm('ยกเลิกข้อสอบที่ทำค้างไว้?')){ S=null; saveS(); render(); } }
function openHist(i){ go('result', LS.get(K.hist,[])[i]); }

      <div class="font-bold mb-1">${ans===q.answer?'✔ ถูกต้อง! เก่งมาก':`✘ ยังไม่ถูก คำตอบที่ถูกคือ ${LABELS[q.answer]}. ${esc(q.choices[q.answer])}`}</div>

    if(a!==undefined) c=prac?(a===qq.answer?'bg-emerald-600 text-white':'bg-maroon text-white'):'bg-navy text-white';
    return head+`<button onclick="jump(${i})" class="text-[11px] h-7 rounded ${c} ${i===S.idx?'ring-2 ring-gold ring-offset-1':''} ${bms.includes(qq.id)?'border-2 border-gold':'border border-khaki'}">${i+1}</button>`;

    <div class="flex-1 min-w-[180px] max-w-sm"><div class="text-xs mb-1 text-khaki-light">ทำแล้ว ${answered}/${total} ข้อ</div>${bar(pct(answered,total))}</div>
    ${prac?'':`<div class="text-center"><div class="text-xs text-khaki-light">เวลาคงเหลือ</div><div id="timer" class="font-head text-3xl font-bold text-gold tabular-nums">${fmtTime(Math.round((S.endAt-Date.now())/1000))}</div></div>`}

function choose(i){
  if(!S) return; const q=S.qs[S.idx];
  if(S.mode!=='mock' && S.answers[S.idx]!==undefined) return;
  S.answers[S.idx]=i; if(S.mode!=='mock') recordAnswers([[q.id,i===q.answer]]);
  saveS(); render();
}
function nav(d){ S.idx=Math.min(S.qs.length-1,Math.max(0,S.idx+d)); saveS(); render(); }
function jump(i){ S.idx=i; saveS(); render(); }
function toggleBm(id){ let b=LS.get(K.bm,[]); b=b.includes(id)?b.filter(x=>x!==id):[...b,id]; LS.set(K.bm,b); render(); }

/* =====================================================================
   10) SUBMIT & SCORING — ≥60% ต่อภาค / รวม 90 / เป้า 120
   ===================================================================== */
function submitExam(auto=false){
  if(!S) return;
  const total=S.qs.length, answered=Object.keys(S.answers).length;
  if(!auto && !confirm(`ยืนยันส่งข้อสอบ?\nทำแล้ว ${answered}/${total} ข้อ${answered<total?`\n(ยังไม่ได้ทำ ${total-answered} ข้อ ซึ่งจะได้ 0 คะแนน)`:''}`)) return;
  const per={}; Object.keys(SUBJECTS).forEach(k=>per[k]={c:0,t:0});
  const wrong=[], rec=[];
  S.qs.forEach((q,i)=>{ const a=S.answers[i], ok=a===q.answer; per[q.subject].t++; if(ok) per[q.subject].c++;
    else wrong.push({no:i+1,id:q.id,subject:q.subject,question:q.question,choices:q.choices,answer:q.answer,chosen:a??null,explanation:q.explanation});
    if(S.mode==='mock') rec.push([q.id,ok]); });
  if(rec.length) recordAnswers(rec);
  const part=p=>Object.keys(SUBJECTS).filter(k=>SUBJECTS[k].part===p).reduce((s,k)=>({c:s.c+per[k].c,t:s.t+per[k].t}),{c:0,t:0});
  const A=part('A'), B=part('B'), sum=A.c+B.c, needA=Math.ceil(A.t*PASS_RATIO), needB=Math.ceil(B.t*PASS_RATIO);
  const passA=A.t===0||A.c>=needA, passB=B.t===0||B.c>=needB;
  const r={ id:Date.now(), mode:S.mode, setNo:S.setNo||null, label:S.label, date:new Date().toISOString(), per, A, B, total:sum, totalQ:total,
            needA, needB, passA, passB, pass:passA&&passB&&sum>=needA+needB, target:Math.ceil(total*TARGET_RATIO),
            duration:Math.round((Date.now()-S.startedAt)/1000), auto, wrong };
  const {wrong:_w,...summary}=r;
  LS.set(K.hist,[summary,...LS.get(K.hist,[])].slice(0,50)); LS.set(K.last,r);
  S=null; saveS(); go('result',r);
}

    <div class="card p-4"><div class="text-sm text-khaki-dark">ภาค ข เฉพาะตำแหน่ง</div><div class="font-head text-3xl font-bold ${r.passB?'text-emerald-700':'text-maroon'}">${r.B.c}<span class="text-base text-khaki-dark">/${r.B.t}</span></div>${r.B.t?bar(pct(r.B.c,r.B.t),r.passB?'bg-emerald-600':'bg-maroon'):''}<div class="text-xs mt-1">เกณฑ์ ≥ ${r.needB}</div></div>

let filt={q:'',set:'all',subject:'all',issue:'all'}, selected=new Set(), showLimit=200, _issues={}, _filtered=[];
const ISSUE={noexp:'ไม่มีคำอธิบาย', letter:'คำอธิบายอ้างตัวอักษรช้อยส์', dupq:'โจทย์ซ้ำกัน', dupc:'ตัวเลือกซ้ำกัน'};
const normText=s=>String(s??'').replace(/\s+/g,'').toLowerCase();
// ตรวจคำอธิบายที่อ้าง "ข้อ ก", "ตัวเลือก ข", "ตอบ ค." ซึ่งจะผิดเมื่อสลับช้อยส์
const LETTER_REF=/(ข้อ|ตัวเลือก|ช้อยส์|ช้อยซ์|ตอบ)\s*[กขคง](?=\s|[.)\],:]|$|และ|หรือ|ถูก|ผิด)/;
const cleanId=s=>String(s??'').trim().replace(/[^\w\u0E00-\u0E7F.-]/g,'-');

function analyzeBank(bank){
  const cnt={}; bank.forEach(q=>{ const k=normText(q.question); cnt[k]=(cnt[k]||0)+1; });
  const out={};
  bank.forEach(q=>{ const a=[];
    if(!String(q.explanation||'').trim()) a.push('noexp');
    if(!q.fixed && LETTER_REF.test(q.explanation||'')) a.push('letter');
    if(cnt[normText(q.question)]>1) a.push('dupq');
    if(new Set(q.choices.map(normText)).size<4) a.push('dupc');
    out[q.id]=a; });
  return out;
}
function nextId(set,sub,bank){
  const p=`S${set}-${SUBJECTS[sub].code}-`; let n=0;
  bank.forEach(q=>{ if(q.id.startsWith(p)){ const v=parseInt(q.id.slice(p.length)); if(v>n) n=v; } });
  return p+String(n+1).padStart(3,'0');
}
function viewBank(){
  const bank=getBank(); _issues=analyzeBank(bank);
  const count=k=>bank.filter(q=>_issues[q.id].includes(k)).length;
  return `<div class="card p-5">
    <div class="flex flex-wrap justify-between items-center gap-2 mb-4">

      <div class="flex flex-wrap gap-2">
        <button onclick="openEditor()" class="bg-gold text-navy font-bold px-4 py-2 rounded-lg hover:bg-gold-light">+ เพิ่มข้อสอบ</button>
        <button onclick="exportBank('csv')" class="btn-o">ส่งออก CSV (<span id="expCnt">0</span>)</button>

      </div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
      ${Object.entries(ISSUE).map(([k,l])=>`<button onclick="setIssue('${k}')" class="text-left rounded-xl border p-3 transition ${filt.issue===k?'border-maroon bg-red-50 ring-1 ring-maroon':'border-khaki hover:bg-khaki-light/50'}">
        <div class="font-head text-2xl font-bold ${count(k)?'text-maroon':'text-emerald-700'}">${count(k)}</div><div class="text-xs">${l}</div></button>`).join('')}
    </div>
    ${filt.issue!=='all'?`<div class="text-sm mb-2">กำลังกรอง: <b class="text-maroon">${ISSUE[filt.issue]}</b> <button onclick="setIssue('${filt.issue}')" class="underline ml-2">ล้างตัวกรอง</button></div>`:''}
    <div class="grid md:grid-cols-4 gap-3">
      <input class="inp md:col-span-2" placeholder="ค้นหา id, โจทย์ หรือตัวเลือก" value="${esc(filt.q)}" oninput="filt.q=this.value;showLimit=200;renderBankTable()">
      <select class="inp" onchange="filt.set=this.value;showLimit=200;renderBankTable()"><option value="all">ทุกชุด</option><option value="0" ${filt.set==='0'?'selected':''}>คลังกลาง (0)</option>

      <select class="inp" onchange="filt.subject=this.value;showLimit=200;renderBankTable()"><option value="all">ทุกวิชา</option>
        ${Object.entries(SUBJECTS).map(([k,s])=>`<option value="${k}" ${filt.subject===k?'selected':''}>${s.short}</option>`).join('')}</select>
    </div>

      <button id="bulkDel" onclick="bulkDelete()" class="bg-maroon text-white px-4 py-1.5 rounded-lg text-sm font-bold disabled:opacity-40" disabled>ลบที่เลือก</button></div>

      <tbody id="bankBody"></tbody></table></div>
    <div class="text-center mt-3"><button id="moreBtn" onclick="showLimit+=200;renderBankTable()" class="btn-o hidden">แสดงเพิ่ม</button></div>

function filteredBank(){
  const s=normText(filt.q);
  return getBank().filter(x=>(filt.set==='all'||String(x.set)===filt.set)&&(filt.subject==='all'||x.subject===filt.subject)
      &&(filt.issue==='all'||(_issues[x.id]||[]).includes(filt.issue))&&(!s||normText(x.id+x.question+x.choices.join('|')).includes(s)))
    .sort((a,b)=>(a.set-b.set)||a.id.localeCompare(b.id));

    <td class="p-2">${(_issues[q.id]||[]).map(k=>`<span class="inline-block text-[11px] px-2 py-0.5 rounded bg-red-50 text-maroon mr-1 mb-1 whitespace-nowrap">${ISSUE[k]}</span>`).join('')}</td>
    <td class="p-2 whitespace-nowrap text-right"><button onclick="openEditor('${esc(q.id)}')" class="underline font-bold">แก้ไข</button><button onclick="deleteQ('${esc(q.id)}')" class="underline text-maroon ml-3">ลบ</button></td>
  </tr>`).join('') || `<tr><td colspan="8" class="p-6 text-center text-khaki-dark">ไม่พบข้อสอบ</td></tr>`;
  $('#bankInfo').textContent=`พบ ${list.length} ข้อ · เลือก ${selected.size} ข้อ`+(list.length>showLimit?` · แสดง ${showLimit} ข้อแรก`:'');
  $('#bulkDel').disabled=!selected.size; $('#expCnt').textContent=list.length;
  $('#chkAll').checked=list.length>0&&list.every(q=>selected.has(q.id));
  $('#moreBtn').classList.toggle('hidden',list.length<=showLimit);
}
function setIssue(k){ filt.issue=filt.issue===k?'all':k; showLimit=200; render(); }
function toggleSel(id,on){ on?selected.add(id):selected.delete(id); renderBankTable(); }

function cleanupRefs(ids){
  const set=new Set(ids); LS.set(K.bm,LS.get(K.bm,[]).filter(x=>!set.has(x)));

    + s.choices.map((c,i)=>`<div class="${i===s.answer?'text-emerald-700 font-bold':''}">${LABELS[i]}. ${esc(c)} ${i===s.answer?'✔ เฉลย':''}</div>`).join('');
}
function saveEditor(){
  const q=readEditor(), err=m=>{ $('#e_err').textContent=m; };
  if(!q.question) return err('กรุณากรอกโจทย์');
  if(q.choices.some(c=>!c)) return err('กรุณากรอกตัวเลือกให้ครบ 4 ตัว');
  if(new Set(q.choices.map(normText)).size<4) return err('มีตัวเลือกซ้ำกัน กรุณาแก้ไข');
  if(!q.fixed && LETTER_REF.test(q.explanation) && !confirm('คำอธิบายอ้างตัวอักษรช้อยส์ ซึ่งจะไม่ตรงเมื่อสลับช้อยส์\nยืนยันบันทึกหรือไม่?')) return;
  const bank=[...getBank()];
  q.id=cleanId(q.id)||nextId(q.set,q.subject,bank);
  if(q.id!==editing.orig && bank.some(x=>x.id===q.id)) return err(`id "${q.id}" มีอยู่แล้วในคลัง`);
  if(editing.orig){
    bank[bank.findIndex(x=>x.id===editing.orig)]=q;
    if(q.id!==editing.orig){                                   // เปลี่ยน id → ย้าย Bookmark/สถิติตาม
      LS.set(K.bm,LS.get(K.bm,[]).map(x=>x===editing.orig?q.id:x));
      const st=LS.get(K.stats,{}); if(st[editing.orig]){ st[q.id]=st[editing.orig]; delete st[editing.orig]; LS.set(K.stats,st); }
    }
  } else bank.push(q);
  saveBank(bank); const wasEdit=!!editing.orig; closeEditor(); render(); toast(wasEdit?'บันทึกการแก้ไขแล้ว':`เพิ่มข้อ ${q.id} แล้ว`);
}

const TPL_JSON = { questions:[
  {id:'S1-IT-201',set:1,subject:'it',difficulty:1,question:'อุปกรณ์ใดเป็นหน่วยรับข้อมูล (Input Unit)',choices:['Keyboard','Monitor','Speaker','Printer'],answer:'ก',explanation:'Keyboard เป็น Input ส่วน Monitor, Speaker, Printer เป็น Output',fixed_order:false},

]};
const SUBJECT_ALIASES={ math:['math','คำนวณ','คณิต','ความสามารถทั่วไป'], thai:['thai','ภาษาไทย','ไทย'], it:['it','computer','คอม','เทคโนโลยี','สารสนเทศ'],
                        saraban:['saraban','สารบรรณ'], law:['law','กฎหมาย'], english:['english','eng','อังกฤษ'] };
function normSubject(s){ s=String(s||'').trim().toLowerCase(); if(SUBJECTS[s]) return s;
  for(const [k,al] of Object.entries(SUBJECT_ALIASES)) if(al.some(a=>s.includes(a))) return k; return null; }
function normAnswer(a){ const s=String(a??'').trim().toUpperCase().replace('.','');
  const m={'ก':0,'ข':1,'ค':2,'ง':3,'A':0,'B':1,'C':2,'D':3,'1':0,'2':1,'3':2,'4':3}; return s in m?m[s]:-1; }
function parseCSV(text){
  text=text.replace(/^\uFEFF/,''); const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c; }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function normalizeQ(o){
  const subject=normSubject(o.subject); if(!subject) return {error:`subject "${o.subject}" ไม่ถูกต้อง`};
  if(!String(o.question||'').trim()) return {error:'ไม่มีโจทย์ (question)'};
  const choices=(Array.isArray(o.choices)?o.choices:[o.choice_a,o.choice_b,o.choice_c,o.choice_d]).map(x=>String(x??'').trim());
  if(choices.length!==4||choices.some(c=>!c)) return {error:'ต้องมีตัวเลือกครบ 4 ตัว'};
  const answer=normAnswer(o.answer); if(answer<0) return {error:`answer "${o.answer}" ไม่ถูกต้อง (ใช้ ก/ข/ค/ง หรือ A–D หรือ 1–4)`};
  const set=parseInt(o.set)||0, d=parseInt(o.difficulty);
  return { q:{ id:cleanId(o.id), set:(set>=1&&set<=10)?set:0, subject, difficulty:[1,2,3].includes(d)?d:2, question:String(o.question).trim(),
    choices, answer, explanation:String(o.explanation||'').trim(), fixed:['1','true','yes','y'].includes(String(o.fixed_order??o.fixed??'').toLowerCase()) } };
}
async function handleFile(file){
  if(!file) return; let raw=[];
  try{
    const text=await file.text();
    if(file.name.toLowerCase().endsWith('.json')){ const j=JSON.parse(text); raw=Array.isArray(j)?j:(j.questions||[]); }
    else { const rows=parseCSV(text); const h=rows[0].map(x=>x.trim().toLowerCase()); raw=rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]??'').trim()]))); }
  }catch(e){ uploadMsg=`<div class="text-maroon">อ่านไฟล์ไม่สำเร็จ: ${esc(e.message)}</div>`; return render(); }
  const map=new Map(getBank().map(q=>[q.id,q])), errs=[]; let added=0, updated=0;
  raw.forEach((o,i)=>{ const r=normalizeQ(o); if(r.error) return errs.push(`แถว/ข้อที่ ${i+1}: ${r.error}`);
    const q=r.q; if(!q.id) q.id=nextId(q.set,q.subject,[...map.values()]);
    map.has(q.id)?updated++:added++; map.set(q.id,q); });
  saveBank([...map.values()]);
  uploadMsg=`<div class="text-emerald-700 font-bold">✔ นำเข้าสำเร็จ: เพิ่มใหม่ ${added} ข้อ • เขียนทับ ${updated} ข้อ</div>${errs.length?`<div class="text-maroon mt-1">✘ ข้าม ${errs.length} รายการ:<br>${errs.slice(0,20).map(esc).join('<br>')}</div>`:''}`;
  render();
}
function downloadTemplate(t){ download(t==='csv'?'\uFEFF'+TPL_CSV:JSON.stringify(TPL_JSON,null,2), `nco_questions_template.${t}`, t==='csv'?'text/csv;charset=utf-8':'application/json'); }
function genMathBank(){
  const map=new Map(getBank().map(q=>[q.id,q])); let n=0;
  for(let s=1;s<=10;s++) for(let i=0;i<20;i++){ const q=genMath(s,i); if(!map.has(q.id)){ map.set(q.id,q); n++; } }
  saveBank([...map.values()]); uploadMsg=`<div class="text-emerald-700 font-bold">✔ เพิ่มโจทย์คำนวณอัตโนมัติ ${n} ข้อ${n?'':' (มีครบแล้ว)'}</div>`; render();
}

async function restoreBackup(file){
  if(!file) return;
  try{
    const j=JSON.parse(await file.text());
    if(j.app!=='nco-exam-2569'||!j.data) throw new Error('ไม่ใช่ไฟล์ Backup ของระบบนี้');
    if(!confirm(`กู้คืนข้อมูลจาก Backup วันที่ ${new Date(j.exportedAt).toLocaleString('th-TH')}?\nข้อมูลปัจจุบันจะถูกแทนที่ทั้งหมด`)) return;
    Object.values(K).forEach(k=>localStorage.removeItem(k));
    Object.entries(j.data).forEach(([k,v])=>{ if(Object.values(K).includes(k)) LS.set(k,v); });
    _bank=null; S=LS.get(K.session,null); selected.clear(); render(); toast('กู้คืนข้อมูลสำเร็จ');
